---
- name: Set tuned profile directory path.
  ansible.builtin.set_fact:
    tuned_profile_base_dir: >-
      {{ '/etc/tuned/profiles' if (
        (ansible_distribution in ['Rocky', 'RedHat', 'AlmaLinux'] and ansible_distribution_major_version | int >= 10) or
        (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 26)
      ) else '/etc/tuned' }}

- name: Create custom tuned profile directory.
  ansible.builtin.file:
    path: "{{ tuned_profile_base_dir }}/{{ tuned_active_custom_profile.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy custom profile configuration file.
  ansible.builtin.template:
    src: custom_profile.conf.j2
    dest: "{{ tuned_profile_base_dir }}/{{ tuned_active_custom_profile.name }}/tuned.conf"
    owner: root
    group: root
    mode: "0644"
  register: profile_config

- name: Set active tuned profile via symlink.
  ansible.builtin.file:
    src: "{{ tuned_profile_base_dir }}/{{ tuned_active_custom_profile.name }}"
    dest: "/etc/tuned/active_profile"
    state: link
    force: true
  register: active_link

- name: Check if custom profile is already active.
  ansible.builtin.shell: |
    set -e
    tuned-adm active | grep -q "{{ tuned_active_custom_profile.name }}" && echo "active" || echo "not_active"
  args:
    executable: /bin/bash
  register: profile_active_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Activate custom tuned profile.
  ansible.builtin.shell: |
    set -e
    tuned-adm profile {{ tuned_active_custom_profile.name }}
  args:
    executable: /bin/bash
  when: profile_active_check.stdout == "not_active"
  register: profile_activation
  changed_when: profile_activation.rc == 0
  failed_when: false
  ignore_errors: true
