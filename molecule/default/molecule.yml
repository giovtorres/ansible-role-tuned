---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: instance
    dockerfile: ../resources/images/Dockerfile.${MOLECULE_DISTRO:-rockylinux9}
    image: "ansible-role-tuned-${MOLECULE_DISTRO:-rockylinux9}:latest"
    command: "/usr/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: false
    systemd: always
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer, yaml
      stdout_callback: yaml
      deprecation_warnings: false
      remote_tmp: /tmp/.ansible-${USER}/tmp
  inventory:
    host_vars:
      instance:
        ansible_user: root
verifier:
  name: testinfra
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
